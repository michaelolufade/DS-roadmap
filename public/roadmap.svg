<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Cyan/Emerald Accent Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Node Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Container / Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Connecting Roadmap Path -->
  <path d="M 16 48 L 28 36 L 40 42 L 50 18"
        fill="none"
        stroke="url(#pathGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Secondary Connections (Data Mesh) -->
  <path d="M 16 48 L 40 42 M 28 36 L 50 18"
        fill="none"
        stroke="rgba(56, 189, 248, 0.2)"
        stroke-width="1.5"
        stroke-dasharray="2 2" />

  <!-- Data Nodes -->
  <!-- Start Node -->
  <circle cx="16" cy="48" r="3.5" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Step 2 -->
  <circle cx="28" cy="36" r="3.5" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Step 3 -->
  <circle cx="40" cy="42" r="3.5" fill="#090d16" stroke="#34d399" stroke-width="2.5" />

  <!-- Target / Goal Node (Glowing) -->
  <circle cx="50" cy="18" r="4.5" fill="#818cf8" filter="url(#glow)" />
  <circle cx="50" cy="18" r="2" fill="#ffffff" />
</svg>
